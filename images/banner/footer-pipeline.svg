<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#05201d"/>
    </linearGradient>
    <path id="f" d="M0 70 C 300 40, 500 95, 800 60 S 1100 45, 1200 70"/>
  </defs>
  <rect width="1200" height="110" rx="18" fill="url(#bg)"/>
