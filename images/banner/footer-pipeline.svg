  <circle r="5" fill="#5eead4"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle>
  <circle r="4" fill="#86efac"><animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ccfbf1">Thanks for visiting · Gracias por la visita</text>
